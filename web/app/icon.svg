<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="renditeradar">
  <title>renditeradar</title>
  <rect width="32" height="32" rx="6" fill="#146c6b" />
  <!-- Radarbogen: zwei Kreisausschnitte um den Ursprung unten links -->
  <path d="M6 25a12 12 0 0 1 12-12" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round" />
  <path d="M6 25a19 19 0 0 1 19-19" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round" />
  <!-- Steigende Linie als Rendite, mit Punkt am oberen Ende -->
  <path d="M6 25 22 9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="22" cy="9" r="3" fill="#ffffff" />
</svg>
